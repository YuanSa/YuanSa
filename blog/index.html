  <meta charset="UTF-8" />

  <title>想法 | 杨子涵</title>
  <meta name="description" content="杨子涵关于 AI、产品、组织和工程的想法。" />
  <link rel="stylesheet" href="/styles/tokens.css" />
  <link rel="stylesheet" href="/styles/global.css" />
  <script type="module" src="/components/site-header.js"></script>
  <script type="module" src="/components/site-footer.js"></script>

</head>
<body>
  <site-header current="blog"></site-header>
  <main class="content-page page-container">
    <div class="content-page__lead">
      <h1 data-en="Write judgment down, and let experience take shape.">把判断写下来，让经验慢慢成形。</h1>
      <p data-en="Notes on AI products, engineering organizations, business fields, and personal working methods. I write for reusable judgment, not frequency.">这里记录我对 AI 产品、工程组织、业务现场和个人工作方法的观察。文字不追求频率，追求可复用的判断。</p>
    </div>
    <div class="content-grid">
      <article class="content-tile">
        <small>Essay</small>
        <h2 data-en="AI is not a feature. It is a workflow variable.">AI 不是功能，而是流程变量</h2>
        <p data-en="When models enter real workflows, the key question shifts from whether they can answer to who confirms and how to roll back.">当模型进入真实工作流，关键问题会从“能不能回答”变成“由谁确认、如何回滚”。</p>
      </article>
      <article class="content-tile">
        <small>Essay</small>
        <h2 data-en="System design begins with boundary design.">系统设计首先是边界设计</h2>
        <p data-en="The stability of complex systems often comes from clearly separating what should be automated from what must keep human judgment.">复杂系统的稳定性，常常来自清楚地区分什么应该自动化，什么必须保留人的判断。</p>
      </article>
      <article class="content-tile">
        <small>Essay</small>
        <h2 data-en="Turn experience into portable structure.">把经验变成可迁移结构</h2>
        <p data-en="The value of writing is not recording what happened, but extracting judgment frameworks that can be used again.">写作的价值不是记录发生过什么，而是抽出下次还能使用的判断框架。</p>
      </article>
    </div>
  </main>
  <site-footer></site-footer>
  <contact-modal></contact-modal>
</body>
</html>
