<!DOCTYPE html>
<html lang="zh-CN" data-title-zh="服务 / 工作 | 杨子涵" data-title-en="Work / Service | YANG Zihan">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>服务 / 工作 | 杨子涵</title>
  <meta name="description" content="杨子涵提供 AI 提效、业务深度融合和可靠工程交付的服务说明。" />
  <link rel="stylesheet" href="/styles/tokens.css" />
  <link rel="stylesheet" href="/styles/global.css" />
  <script type="module" src="/components/site-header.js"></script>
  <script type="module" src="/components/site-footer.js"></script>
  <script type="module" src="/components/contact-modal.js"></script>
</head>
<body>
  <site-header current="work"></site-header>
  <main class="content-page page-container">
    <div class="content-page__lead">
      <h1 data-en="AI efficiency has to be embedded in the business, not attached to it.">AI 提效必须长在业务里，而不是贴在业务外面。</h1>
      <p data-en="I combine product judgment, frontend engineering, BFF/API implementation, and field research to deliver AI-enabled workflows that can be measured and maintained.">我结合产品判断、前端工程、BFF/API 实现和现场调研，交付可衡量、可维护的 AI 工作流。</p>
    </div>

    <div class="paper-list">
      <article>
        <span data-en="I">一</span>
        <h3 data-en="Business diagnosis">业务诊断</h3>
        <p data-en="Map the real workflow, decision points, data sources, risk boundaries, and people who will operate the system every day.">梳理真实流程、决策节点、数据来源、风险边界，以及每天真正使用系统的人。</p>
      </article>
      <article>
        <span data-en="II">二</span>
        <h3 data-en="AI workflow implementation">AI 工作流落地</h3>
        <p data-en="Move model capability into support, review, content, operations, and data workflows with traceability, fallback, and human confirmation.">把模型能力放进客服、审核、内容、运营和数据处理流程，并保留追踪、兜底与人工确认。</p>
      </article>
      <article>
        <span data-en="III">三</span>
        <h3 data-en="Reliable product engineering">可靠产品工程</h3>
        <p data-en="Build interfaces, BFF layers, state systems, component libraries, and testable delivery paths that keep evolving after launch.">搭建界面、BFF 层、状态系统、组件库和可测试的交付路径，让系统上线后仍能持续演进。</p>
      </article>
      <article>
        <span data-en="IV">四</span>
        <h3 data-en="Outcome review">结果复盘</h3>
        <p data-en="Measure time saved, error reduction, collaboration efficiency, and user experience changes, then decide the next iteration from evidence.">围绕节省时间、错误下降、协作效率和用户体验变化复盘，用证据决定下一轮迭代。</p>
      </article>
    </div>
  </main>
  <site-footer></site-footer>
  <contact-modal></contact-modal>
